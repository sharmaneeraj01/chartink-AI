name: Run Chartink AI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '30 14 * * 1-5'    # 14:30 IST
    - cron: '30 22 * * 1-5'  # 22:30 IST
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
      - name: Run GetMarketStrength test
        run: python test_getmarketstrength.py

         
